# Release-Prüfung bei jedem Pull Request nach main (U-024): Gitleaks prüft Code und Git-Geschichte auf Geheimwerte.
# Bewusst "pull_request", nicht "pull_request_target"; keine Geheimwerte nötig.
name: Release-Prüfung

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-pruefung-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefung:
    name: Release Prüfung
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Werkzeug holen (Stand des Pull Requests)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: werkzeug
          persist-credentials: false
          fetch-depth: 0

      - name: Gitleaks (keine Geheimwerte in Code und Git-Geschichte)
        run: |
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          cd werkzeug
          "$RUNNER_TEMP/gitleaks" git . --log-opts="--all" --config .gitleaks.toml --redact --no-banner --exit-code 1
          "$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --redact --no-banner --exit-code 1
